name: Atualizar projetos no README

on:
  schedule:
    # Roda todo dia às 09:00 (horário de Brasília, UTC-3 => 12:00 UTC)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite rodar manualmente na aba "Actions"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar script de atualização
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: atualiza projetos em destaque no README"
          git push
